name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    # Lint and CPU unit tests. tests/sim needs the ~10 GB RoboCasa kitchen
    # assets and is run locally: `pytest -m sim` after download_kitchen_assets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install (core + dev)
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uvx ruff@0.16.10 check
      - name: Unit tests (includes the portability guard)
        run: uv run pytest tests/unit -q
